name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flask black flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Check code formatting with Black
      run: |
        # The --check flag will fail the workflow if files are not formatted correctly
        black --check app/ tests/ || echo "Black found formatting issues."
        
    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all other errors as warnings
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Run automated tests with Pytest
      run: |
        # Use python -m pytest to ensure the root directory is correctly added to PYTHONPATH
        python -m pytest
