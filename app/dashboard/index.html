<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Workflow OS</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121b2d;
        --panel-alt: #18243a;
        --text: #ebf1ff;
        --muted: #9fb3d9;
        --accent: #7dd3fc;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --border: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .title {
        font-size: 2rem;
        font-weight: 700;
      }

      .badge {
        background: rgba(125, 211, 252, 0.12);
        border: 1px solid var(--border);
        color: var(--accent);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }

      .card h3 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .metric {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .muted {
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }

      button.primary {
        background: rgba(125, 211, 252, 0.14);
        color: var(--accent);
      }

      ul {
        padding-left: 18px;
        margin: 12px 0 0;
        color: var(--muted);
      }

      li + li { margin-top: 8px; }

      .loading {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .error {
        color: var(--danger);
        font-size: 0.9rem;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
      }

      .modal.open {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-header h2 {
        margin: 0;
      }

      .modal-close {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.5rem;
        padding: 0;
      }

      .modal-close:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="title">Developer Workflow OS</div>
        <div class="badge">MVP command centre</div>
      </div>

      <div class="grid">
        <section class="card">
          <h3>Release readiness</h3>
          <div class="metric" id="release-score" style="color: var(--success);">—</div>
          <div class="muted" id="release-status">Loading...</div>
        </section>

        <section class="card">
          <h3>Recent commits</h3>
          <div class="metric" id="commit-count">—</div>
          <div class="muted" id="commit-status">Loading...</div>
        </section>

        <section class="card">
          <h3>Repository</h3>
          <div class="metric" id="repo-name">—</div>
          <div class="muted" id="repo-status">Loading...</div>
        </section>
      </div>

      <section class="card" style="margin-top: 20px;">
        <h3>Recent artifacts</h3>
        <div id="recent-artifacts" class="muted">Loading recent artifacts...</div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: var(--muted);">
          Source: <code>/api/artifacts?limit=5</code>
        </div>
      </section>

      <div class="card" style="margin-top: 20px;">
        <h3>Quick actions</h3>
        <div class="actions">
          <button class="primary" onclick="showWeeklyDigest()">Weekly digest</button>
          <button onclick="showReleaseReadiness()">Release readiness</button>
          <button onclick="showRepoIndex()">Workspace map</button>
          <button onclick="showRoutineStatus()">Routine status</button>
          <button onclick="showPlanStatus()">Plan status</button>
          <button onclick="showReleaseStatus()">Release status</button>
          <button onclick="showActionItems()">Action items</button>
          <button onclick="showArtifactNavigation()">Artifacts</button>
          <button onclick="showRoutineHistory()">Routine history</button>
          <button onclick="showSprintRecap()">Sprint recap</button>
          <button onclick="showFeatureParity()">Feature parity</button>
          <button onclick="showProjectSnapshot()">Project snapshot</button>
        </div>
      </div>
    </div>

    <!-- Modal for displaying details -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Details</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <script>
      const API_BASE = window.location.origin || "";

      function showError(message) {
        console.error(message);
      }

      function openModal(title, content) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-body").innerHTML = content;
        document.getElementById("modal").classList.add("open");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("open");
      }

      async function loadRecentArtifacts() {
        try {
          const response = await fetch(`${API_BASE}/api/artifacts?limit=5`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();
          const artifacts = data.artifacts || [];

          const container = document.getElementById("recent-artifacts");
          if (!artifacts.length) {
            container.innerHTML = "No recent artifacts yet.";
            return;
          }

          const html = artifacts
            .slice(0, 5)
            .map((artifact) => `
              <div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
                <strong>${escapeHtml(artifact.name || artifact.type || "Artifact")}</strong>
                <div style="color: var(--muted); font-size: 0.82rem; margin-top: 4px;">
                  ${escapeHtml(artifact.type || "artifact")} • ${escapeHtml(artifact.created_at ? new Date(artifact.created_at).toLocaleString() : "recent")}
                </div>
              </div>
            `)
            .join("");

          container.innerHTML = html;
        } catch (error) {
          showError(`Failed to load recent artifacts: ${error.message}`);
          document.getElementById("recent-artifacts").innerHTML = "Unable to load recent artifacts.";
        }
      }

      async function loadDashboard() {
        try {
          const response = await fetch(`${API_BASE}/api/digest/weekly`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          document.getElementById("release-score").innerText = `${data.release_score}%`;
          document.getElementById("release-status").innerText =
            `Status: ${data.release_status}` + (data.blockers.length > 0 ? ` (${data.blockers.length} blockers)` : "");
          document.getElementById("commit-count").innerText = data.total_commits || "0";
          document.getElementById("commit-status").innerText = "Total commits on main";
          document.getElementById("repo-name").innerText = data.repo_name || "—";
          document.getElementById("repo-status").innerText = `${data.branch_count} branches`;
        } catch (error) {
          showError(`Failed to load dashboard: ${error.message}`);
          document.getElementById("release-status").innerText = "Failed to load";
          document.getElementById("commit-status").innerText = "Failed to load";
          document.getElementById("repo-status").innerText = "Failed to load";
        }

        await loadRecentArtifacts();
      }

      async function showWeeklyDigest() {
        try {
          const response = await fetch(`${API_BASE}/api/digest/weekly`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<pre style="color: var(--muted); font-size: 0.85rem; overflow-x: auto;">${escapeHtml(data.summary)}</pre>`;
          if (data.blockers.length > 0) {
            html += `<h4>Blockers:</h4><ul>`;
            data.blockers.forEach(b => {
              html += `<li>${escapeHtml(b)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Weekly digest", html);
        } catch (error) {
          openModal("Weekly digest", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showReleaseReadiness() {
        try {
          const response = await fetch(`${API_BASE}/api/release/readiness`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `
            <p><strong>Score:</strong> ${data.score}/100</p>
            <p><strong>Status:</strong> <span style="color: ${data.status === 'ready' ? 'var(--success)' : data.status === 'watch' ? 'var(--warning)' : 'var(--danger)'}">${data.status}</span></p>
            <pre style="color: var(--muted); font-size: 0.85rem; overflow-x: auto;">${escapeHtml(data.summary)}</pre>
          `;

          if (data.blockers.length > 0) {
            html += `<h4>Blockers:</h4><ul>`;
            data.blockers.forEach(b => {
              html += `<li>${escapeHtml(b)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Release readiness", html);
        } catch (error) {
          openModal("Release readiness", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showRepoIndex() {
        try {
          const response = await fetch(`${API_BASE}/api/repo/index`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Repository: ${escapeHtml(data.repo_name)}</h4>`;

          if (data.areas && data.areas.length > 0) {
            html += `<h5>Areas:</h5><ul>`;
            data.areas.forEach(a => {
              html += `<li>${escapeHtml(a.name)} <span style="color: var(--muted);">(${escapeHtml(a.path)})</span></li>`;
            });
            html += `</ul>`;
          }

          if (data.key_files && data.key_files.length > 0) {
            html += `<h5>Key files:</h5><ul>`;
            data.key_files.forEach(f => {
              html += `<li><code style="color: var(--accent);">${escapeHtml(f)}</code></li>`;
            });
            html += `</ul>`;
          }

          openModal("Workspace map", html);
        } catch (error) {
          openModal("Workspace map", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showRoutineStatus() {
        try {
          const response = await fetch(`${API_BASE}/api/routines`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Registered routines</h4><ul>`;
          data.routines.forEach(r => {
            html += `<li><strong>${escapeHtml(r.name)}</strong> — ${escapeHtml(r.interval)}${r.description ? ` — ${escapeHtml(r.description)}` : ""}</li>`;
          });
          html += `</ul>`;

          openModal("Routine status", html);
        } catch (error) {
          openModal("Routine status", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showPlanStatus() {
        try {
          const response = await fetch(`${API_BASE}/api/plan/status`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          const statusColor = data.status === 'complete' ? 'var(--success)' : 'var(--warning)';
          let html = `
            <p><strong>Status:</strong> <span style="color: ${statusColor}">${escapeHtml(data.status)}</span></p>
            <p><strong>Sections checked:</strong> ${escapeHtml(String(data.sections_checked))}</p>
          `;

          if (data.coverage) {
            html += `<h4>Coverage:</h4><ul>`;
            Object.entries(data.coverage).forEach(([name, value]) => {
              html += `<li><strong>${escapeHtml(name)}</strong>: ${value ? 'implemented' : 'pending'}</li>`;
            });
            html += `</ul>`;
          }

          if (data.missing && data.missing.length > 0) {
            html += `<h4>Missing:</h4><ul>`;
            data.missing.forEach(item => {
              html += `<li>${escapeHtml(item)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Plan status", html);
        } catch (error) {
          openModal("Plan status", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showReleaseStatus() {
        try {
          const response = await fetch(`${API_BASE}/api/dashboard/release-status`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          const readiness = data.readiness || {};
          const notes = data.notes || {};

          const statusColor = readiness.status === 'ready' ? 'var(--success)' : readiness.status === 'watch' ? 'var(--warning)' : 'var(--danger)';

          let html = `
            <h4>Release Readiness</h4>
            <p><strong>Score:</strong> ${readiness.score}/100</p>
            <p><strong>Status:</strong> <span style="color: ${statusColor}">${escapeHtml(readiness.status)}</span></p>
          `;

          if (readiness.blockers && readiness.blockers.length > 0) {
            html += `<h5>Blockers:</h5><ul>`;
            readiness.blockers.forEach(b => {
              html += `<li>${escapeHtml(b)}</li>`;
            });
            html += `</ul>`;
          }

          html += `<h4>Release Notes</h4>`;
          if (notes.summary) {
            html += `<pre style="color: var(--muted); font-size: 0.85rem; overflow-x: auto; max-height: 400px;">${escapeHtml(notes.summary)}</pre>`;
          }

          openModal("Release status", html);
        } catch (error) {
          openModal("Release status", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showActionItems() {
        try {
          const context = prompt("Enter context (e.g., 'auth', 'payment'):");
          if (!context) return;

          const response = await fetch(`${API_BASE}/api/dashboard/action-items?context=${encodeURIComponent(context)}`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Action Items for "${escapeHtml(context)}"</h4>`;

          if (data.checklists && data.checklists.length > 0) {
            html += `<h5>Implementation Checklist:</h5><ol>`;
            data.checklists.forEach(item => {
              html += `<li>${escapeHtml(item)}</li>`;
            });
            html += `</ol>`;
          }

          if (data.related_files && data.related_files.length > 0) {
            html += `<h5>Related Files:</h5><ul>`;
            data.related_files.forEach(file => {
              html += `<li><code style="color: var(--accent);">${escapeHtml(file)}</code></li>`;
            });
            html += `</ul>`;
          }

          if (data.suggested_checklist && data.suggested_checklist.length > 0) {
            html += `<h5>Suggested Checklist:</h5><ul>`;
            data.suggested_checklist.forEach(item => {
              html += `<li>${escapeHtml(item)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Action items", html);
        } catch (error) {
          openModal("Action items", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showArtifactNavigation() {
        try {
          const response = await fetch(`${API_BASE}/api/artifacts/navigation`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Artifact Navigation</h4><p>Total artifacts: <strong>${data.total_count}</strong></p>`;

          if (data.artifacts && data.artifacts.length > 0) {
            html += `<h5>Recent Artifacts:</h5><ul>`;
            data.artifacts.slice(0, 10).forEach(artifact => {
              html += `<li><strong>${escapeHtml(artifact.name)}</strong> `;
              html += `<span style="color: var(--muted);">(${escapeHtml(artifact.type)})</span></li>`;
            });
            html += `</ul>`;
          } else {
            html += `<p style="color: var(--muted);">No artifacts found.</p>`;
          }

          openModal("Artifacts", html);
        } catch (error) {
          openModal("Artifacts", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showRoutineHistory() {
        try {
          const response = await fetch(`${API_BASE}/api/routines/history`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Routine Execution History</h4><p>Total executions: <strong>${data.total_executions}</strong></p>`;

          if (data.routines && data.routines.length > 0) {
            html += `<h5>Recent Executions:</h5><ul>`;
            data.routines.slice(0, 10).forEach(routine => {
              const statusColor = routine.status === 'ok' ? 'var(--success)' : 'var(--warning)';
              html += `<li><strong>${escapeHtml(routine.routine)}</strong> `;
              html += `<span style="color: ${statusColor};">${escapeHtml(routine.status)}</span></li>`;
            });
            html += `</ul>`;
          } else {
            html += `<p style="color: var(--muted);">No routine executions found.</p>`;
          }

          openModal("Routines", html);
        } catch (error) {
          openModal("Routines", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showSprintRecap() {
        try {
          const response = await fetch(`${API_BASE}/api/sprint/recap`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Sprint Recap</h4>`;
          html += `<p><strong>Summary:</strong> ${escapeHtml(data.summary)}</p>`;

          if (data.features_implemented && data.features_implemented.length > 0) {
            html += `<h5>Features Implemented:</h5><ul>`;
            data.features_implemented.forEach(feature => {
              html += `<li>${escapeHtml(feature)}</li>`;
            });
            html += `</ul>`;
          }

          if (data.tasks_completed && data.tasks_completed.length > 0) {
            html += `<h5>Tasks Completed:</h5><ul>`;
            data.tasks_completed.forEach(task => {
              html += `<li>${escapeHtml(task)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Sprint recap", html);
        } catch (error) {
          openModal("Sprint recap", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showFeatureParity() {
        try {
          const response = await fetch(`${API_BASE}/api/features/parity`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          const parityColor = data.parity_score >= 75 ? 'var(--success)' : data.parity_score >= 50 ? 'var(--warning)' : 'var(--danger)';
          let html = `<h4>Feature Parity</h4>`;
          html += `<p><strong>Parity Score:</strong> <span style="color: ${parityColor};">${data.parity_score}%</span></p>`;

          if (data.planned_features && data.planned_features.length > 0) {
            html += `<h5>Planned Features:</h5><ul>`;
            data.planned_features.forEach(feature => {
              html += `<li>${escapeHtml(feature)}</li>`;
            });
            html += `</ul>`;
          }

          if (data.missing_features && data.missing_features.length > 0) {
            html += `<h5>Missing Features:</h5><ul>`;
            data.missing_features.forEach(feature => {
              html += `<li>${escapeHtml(feature)}</li>`;
            });
            html += `</ul>`;
          }

          openModal("Feature parity", html);
        } catch (error) {
          openModal("Feature parity", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      async function showProjectSnapshot() {
        try {
          const response = await fetch(`${API_BASE}/api/project/snapshot`);
          if (!response.ok) throw new Error(`API error: ${response.status}`);
          const data = await response.json();

          let html = `<h4>Project Snapshot</h4>`;
          html += `<p><strong>Repository:</strong> ${escapeHtml(data.repo_name)}</p>`;
          html += `<p><strong>Status:</strong> ${escapeHtml(data.workflow_status)}</p>`;
          html += `<p><strong>Total Artifacts:</strong> ${data.total_artifacts}</p>`;

          if (data.analysis_artifacts && data.analysis_artifacts.length > 0) {
            html += `<h5>Recent Artifacts:</h5><ul>`;
            data.analysis_artifacts.slice(0, 10).forEach(artifact => {
              html += `<li><strong>${escapeHtml(artifact.name)}</strong> `;
              html += `<span style="color: var(--muted);">(${escapeHtml(artifact.type)})</span></li>`;
            });
            html += `</ul>`;
          }

          openModal("Project snapshot", html);
        } catch (error) {
          openModal("Project snapshot", `<p class="error">Error: ${escapeHtml(error.message)}</p>`);
        }
      }

      function escapeHtml(text) {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
      }

      // Load dashboard on page load
      window.addEventListener("DOMContentLoaded", loadDashboard);

      // Refresh every 30 seconds
      setInterval(loadDashboard, 30000);

      // Close modal on background click
      document.getElementById("modal").addEventListener("click", function(e) {
        if (e.target === this) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
